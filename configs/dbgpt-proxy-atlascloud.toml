[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "your_secret_key"

[service.web]
host = "0.0.0.0"
port = 5670

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-deepseek-ai/DeepSeek-V3.1-Terminus}"
provider = "${env:LLM_MODEL_PROVIDER:-proxy/atlascloud}"
api_key = "${env:ATLASCLOUD_API_KEY}"
