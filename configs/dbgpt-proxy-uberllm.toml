[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "your_secret_key"

[service.web]
host = "0.0.0.0"
port = 5670

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-openai/gpt-4o}"
provider = "proxy/uberllm"
api_key = "${env:UBERLLM_API_KEY}"

# UberLLM serves chat models only. Chat works without an embedding model.
# For knowledge-base (RAG) indexing and retrieval, uncomment an embedding model,
# for example a local Hugging Face model:
# [[models.embeddings]]
# name = "BAAI/bge-large-zh-v1.5"
# provider = "hf"
# path = "models/bge-large-zh-v1.5"
