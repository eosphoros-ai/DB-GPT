#   ① 作为 semantic.get_examples 的返回源，命中后作 few-shot 注入 NL2SQL prompt
#      （consumption: metric_first —— 命中样例优先于泛化生成）
#   ② 作为本套件的评测集：推荐问题 + verified 样例 = eval set（设计 §5.8）
# 写回闭环：
#   👍 有帮助 → use_count + 1，沉淀为新样例（须人审 verified 后入库）
#   ✏️ 纠错   → 生成语义提案进待审队列（semantic.proposals），不直接改本文件
# SQL 约定（所有样例均已注入）：
#   · 指标默认过滤 status IN (1,2,3)      —— 排除 4 取消 / 5 退款
#   · 规则护栏     is_deleted = 0         —— 软删除过滤
#   · 行级权限     tenant_id = :current_tenant —— 执行层按会话身份注入，不可移除
#   · 只读 SELECT，路由 replica（只读从库），带时间过滤命中索引
