# =============================================================================
# DB-GPT 官方场景套件 · 智能取数 (db-query)
# -----------------------------------------------------------------------------
# 本文件是套件包的入口（manifest），等价于 SKILL.md 之于技能。
# 定位：套件 = 会话级声明式配置束；核心 = 执行器（套件只声明，核心来执行）。
# loader 约定（见 docs/design/scenario-suite-impl-plan.md §一）：
#   · 必填字段存在 + 类型粗检 + 缺省值补全，fail-soft（坏字段跳过并告警）
#   · 不引入 jsonschema 依赖，故字段名即为契约，改名 = 破坏解析
#   · approval_overrides 仅可加严，合并顺序：core deny > suite > core default
# =============================================================================

kind: scenario-suite
name: db-query                    # slug，全局唯一
display: 智能取数                  # 场景显示名（对齐 mockup 首页 Tab 与 AntWork plugin.json.displayNameCn）
display_en: Smart Data Query
icon: 🔍
version: 1.0.0
scenario_id: query
description: >-
  自然语言→SQL 精准取数能力包。强制绑定语义层（表白名单 + 指标口径 + 默认过滤 +
  行级权限规则），SQL 经 NL2SQL 生成并通过 sql.validate 自纠后在只读从库执行；
  高代价扫描按预估成本触发审批 confirm；答案下附引用溯源 chips（指标版本/表/样例/规则），
  点赞沉淀样例库、纠错进语义标注待审队列。
author: "@DB-GPT 官方"
tags: [取数, NL2SQL, 语义层, 只读, ChatBI, 官方内置]
category: official                # official | enterprise | marketplace
homepage: docs/design/data-agent-product-design.md#72-智能取数db-取数工作台

# --- 编排策略 ----------------------------------------------------------------
# P0 仅支持 react（自由 ReAct：reason→act→observe）。
# flow 为 P1 预留：届时填 flow: <flow_id> 引用一条 AWEL DAG 做锚定编排。
execution: react
sop: prompts/query-playbook.md    # 包内相对路径，注入 system prompt

# --- 工具白名单 --------------------------------------------------------------
# allow = 会话内可调用工具集，binder 与核心 gate 求交后生效。
# deny 显式声明本套件永不需要的破坏性能力（问数场景无 ddl）。
tools:
  allow: [semantic_search, schema_link, nl2sql, sql_execute, export_csv]
  deny: [ddl, shell]
  provide_mcp: []                 # 本套件不自带 MCP server，全部复用核心内置工具

# --- 默认绑定上下文 ----------------------------------------------------------
context_defaults:
  semantic_model: required        # required | optional | none
  datasource: session             # 会话选择（对话创建时确定，pin 在会话上）
  time_window: session            # 时间窗由会话/问句推断，不预置默认窗口

# --- 语义层结合块（设计 §7.2 四动作：绑定 / 圈定 / pin / 提案）--------------
semantic:
  layer: mysql_prod               # 绑定的语义层实例 id
  require: required               # 缺失时 binder fail-soft 降级 DBSummary 并标注水位线
  scope:                          # 圈定：表白名单 + 指标范围 + 业务域标签
    metrics: [valid_gmv, active_users, order_count]
    tags: [交易]
  pin:
    policy: latest_published      # latest_published | fixed
    version: null                 # fixed 时填指标版本号；latest_published 保持 null
  consumption: metric_first       # 问数 = metric_first（分析套件为 dataset_first）
  proposals: []                   # 语义提案队列（P1：会话内纠错回流的待审提案）

# --- 产物卡（引用核心渲染器注册表，不自带前端代码）--------------------------
artifacts: [sql_card, result_table, citation]

# --- 审批策略（仅可加严）----------------------------------------------------
# 核心默认：只读 SELECT = auto。本套件在此基础上把高代价扫描加严为 confirm。
# 试图把核心 deny 放宽成 auto 的规则会在 merge_suite_overrides 阶段被拒绝。
approval_overrides:
  - match: {tool: sql_execute, est_scan_gb: ">100"}
    action: confirm
    reason: 高代价扫描
  - match: {tool: sql_execute, est_scan_rows: ">50000000"}
    action: confirm
    reason: 超大行数扫描（预估 > 5000 万行）
  - match: {tool: sql_execute, without_time_filter: true}
    action: confirm
    reason: 缺少时间范围过滤的全表聚合
  - match: {tool: export_csv, row_count: ">100000"}
    action: confirm
    reason: 大批量导出（> 10 万行）需确认脱敏与落盘范围

# --- 首页路由与推荐问题 ------------------------------------------------------
routing:
  keywords: [查, 统计, 导出, GMV, 客单价, top, 环比, 明细]
  specificity: 0.8                # 多套件关键词重叠时参与排序（越高越优先）
recommended_questions:
  - {text: 查询上月各区域销售额, hint: 按 region 汇总，含环比}
  - {text: 上个月华东区的有效GMV, hint: 指标 v2 口径 + 默认过滤自动注入}
  - {text: 统计 Top10 客户 GMV 及环比, hint: 客户维度 GMV 排序 + 环比变化}
  - {text: 近30天各品类客单价, hint: 客单价 = valid_gmv / order_count}
  - {text: 导出上月华东区订单明细, hint: 明细导出走脱敏与行数上限}

# --- 输出契约（完成标准）----------------------------------------------------
output_contract: result_set+sql

# --- 快捷命令（/command，套件详情页展示，会话内可显式调用）------------------
commands:
  - name: /nl2sql
    description: 自然语言→SQL 并在只读从库执行（引用指标口径与默认过滤）
    skill: nl2sql-precision
  - name: /schema
    description: 查看目标表结构、语义标注与白名单状态
    skill: semantic-linking
  - name: /metric
    description: 查询指标定义、版本与默认过滤（权威口径回源）
    skill: semantic-linking
  - name: /export
    description: 导出当前结果集为 CSV/Excel（列类型保真 + 脱敏）
    skill: result-export

# --- 包内技能索引（loader 走现有 skill registry，此处仅为 manifest 索引）----
skills:
  - name: semantic-linking
    path: skills/semantic-linking/SKILL.md
    summary: 语义召回与权威口径加载（双路召回、按 metadata.id 回源、type 过滤）
  - name: nl2sql-precision
    path: skills/nl2sql-precision/SKILL.md
    summary: 精准 NL2SQL（组装 prompt、默认过滤/join/白名单注入、sql.validate 自纠）
  - name: readonly-guardrails
    path: skills/readonly-guardrails/SKILL.md
    summary: 只读安全执行（SELECT-only、超时/行数上限、只读从库、行级权限、成本预估审批）
  - name: result-export
    path: skills/result-export/SKILL.md
    summary: 结果集导出 CSV/Excel（列类型保真、脱敏、行数上限）

# --- 样例库（Verified Q→SQL，同时作为本套件的 eval set）---------------------
few_shots:
  path: few_shots/verified-queries.yaml
  consumption: metric_first       # 命中样例优先于泛化生成，作为 few-shot 注入
  writeback: on_thumbs_up         # 👍 沉淀；✏️ 纠错进语义标注待审队列（不直接改权威源）
