# =============================================================================
# DB-GPT 官方场景套件 · 智能分析 (db-analysis)
# -----------------------------------------------------------------------------
# 本文件是套件包的入口（manifest），等价于 SKILL.md 之于技能。
# 定位：套件 = 会话级声明式配置束；核心 = 执行器（套件只声明，核心来执行）。
# loader 约定（见 docs/design/scenario-suite-impl-plan.md §一）：
#   · 必填字段存在 + 类型粗检 + 缺省值补全，fail-soft（坏字段跳过并告警）
#   · 不引入 jsonschema 依赖，故字段名即为契约，改名 = 破坏解析
#   · approval_overrides 仅可加严，合并顺序：core deny > suite > core default
# 与 db-query 的差异（设计 §7.2 vs §7.3）：
#   · 问数把语义层当"精准口径源"（单发 SQL + 引用溯源）
#   · 分析把语义层当"多步一致性约束"（数据集圈定 + 跨步口径统一 + 指标版本 pin）
#   · 二者共用引用溯源与点赞自进化闭环
# =============================================================================

kind: scenario-suite
name: db-analysis                 # slug，全局唯一
display: 智能分析
icon: 📊
version: 1.0.0
scenario_id: analysis
description: >-
  面向企业业务库的图文数据分析能力包。SOP 为"圈数据集 → 多步取数 → 图表 → 结论 →
  报告"：先用语义层表白名单 + 血缘 join 路径圈定数据集（模型不从全量表选表），再多步
  取数且每步引用同一指标定义（版本 pin）、统一注入默认过滤与时间粒度，保证跨图跨步
  口径一致；随后按数据形态自动匹配柱/线/饼/散点，提炼有数据支撑的归因结论，最终导出
  含引用 chips 的 HTML/PDF 报告。以只读为主，审批模式默认 auto-edit。
author: "@DB-GPT 官方"
tags: [分析, 归因, 报告, 可视化, 数据集, 语义层, ChatBI, 官方内置]
category: official                # official | enterprise | marketplace
homepage: docs/design/data-agent-product-design.md#73-智能分析db-数据分析工作台

# --- 编排策略 ----------------------------------------------------------------
# P0 仅支持 react（自由 ReAct：reason→act→observe）。
# 报告生成的确定性后处理（章节绑定/图表校验/引用装配/导出）留 P1 flow 化：
# 届时 execution: flow + flow: analysis-report-flow，套件其余声明不变（见 README §8）。
execution: react
sop: prompts/analysis-playbook.md # 包内相对路径，注入 system prompt

# --- 工具白名单 --------------------------------------------------------------
# allow = 问数全集 + 分析三件套（dataset_scope / chart / report_export）。
# binder 与核心 gate 求交后生效；deny 显式声明本套件永不需要的破坏性能力。
tools:
  allow: [semantic_search, schema_link, nl2sql, sql_execute, dataset_scope, chart, report_export, export_csv]
  deny: [ddl, shell]
  provide_mcp: []                 # 本套件不自带 MCP server，全部复用核心内置工具

# --- 默认绑定上下文 ----------------------------------------------------------
context_defaults:
  semantic_model: required        # required | optional | none（缺失时 fail-soft 降级 DBSummary）
  dataset: required               # 数据集圈定 = 语义层表白名单 + 血缘 join 路径
  datasource: session             # 会话选择（对话创建时确定，pin 在会话上）
  time_window: session            # 分析窗由问句推断（本月/近30天/大促期），不预置默认窗口

# --- 语义层结合块（设计 §7.3 语义使用链：圈定 / pin / 统一注入 / 溯源 / 回流）--
semantic:
  layer: mysql_prod               # 绑定的语义层实例 id
  require: required               # 缺失时 binder fail-soft 降级 DBSummary 并在水位线标注
  scope:                          # 圈定范围：业务域标签 + 可 pin 的指标集合
    metrics: [valid_gmv, paid_order_cnt, aov, refund_rate, active_buyers]
    tags: [交易, 销售]
  pin:                            # 分析强调跨步口径一致，故示范 pin（问数用 latest_published）
    policy: pin                   # pin | latest_published
    versions: {valid_gmv: v2, paid_order_cnt: v1, aov: v1, refund_rate: v1}
    reason: >-
      多步取数会产出多张图与多段结论；若各步各自解析口径，环比/同比/贡献度会出现
      "同一指标不同算法"的自相矛盾。会话级 pin 后，升级只影响新会话，历史报告可复现。
  consumption: metric_first       # 每步取数仍以指标定义为口径源；dataset 只是范围约束
  proposals: []                   # 语义提案队列（报告 ✏️ 纠错回流至语义标注待审，不直改权威源）

# --- 分析场景默认（增补块，非 P0 契约字段；loader fail-soft 忽略未知键）-------
analysis_defaults:
  grain: day                      # 统一时间粒度：day | week | month（各步共用，禁止混粒度对比）
  compare: [mom, yoy]             # 默认对比口径：环比 + 同比
  default_filters: inject         # 语义层默认过滤（软删除/测试单/行级权限）统一注入，各步不重复声明
  max_steps: 8                    # 多步取数步数上限，超限先收敛假设再取数
  chart_type: auto                # 图表自动匹配（柱/线/饼/散点），可被用户显式覆盖
  conclusion: evidence_required   # 结论必须挂数据证据，无证据的推断只能进"待验证假设"

# --- 产物卡（引用核心渲染器注册表，不自带前端代码）--------------------------
artifacts: [dataset_card, chart, conclusion_card, report, citation]

# --- 报告与模板 --------------------------------------------------------------
templates:
  report: templates/report-template.md
report_formats: [markdown, html, pdf]   # html 为默认分享形态；pdf 走核心导出器
report_sections: [summary, dataset_and_semantics, multi_dim_charts, attribution, recommendations, citations]

# --- 审批策略（仅可加严）----------------------------------------------------
# 核心默认：只读 SELECT = auto；本套件以只读为主，会话审批模式默认 auto-edit。
# 以下规则只在核心默认之上加严；试图放宽核心 deny 的规则会被 merge_suite_overrides 拒绝。
approval_overrides:
  - match: {tool: sql_execute, est_scan_gb: ">100"}
    action: confirm
    reason: 高代价扫描
  - match: {tool: sql_execute, est_scan_rows: ">50000000"}
    action: confirm
    reason: 超大行数扫描（预估 > 5000 万行）
  - match: {tool: sql_execute, without_time_filter: true}
    action: confirm
    reason: 缺少时间范围过滤的全表聚合（分析多步取数更易放大该代价）
  - match: {tool: dataset_scope, table_count: ">40"}
    action: confirm
    reason: 数据集过宽（>40 表）会显著降低 schema linking 与口径命中率
  - match: {tool: report_export, share_scope: "external"}
    action: confirm
    reason: 报告外发分享需确认脱敏范围与可见性
  - match: {tool: export_csv, row_count: ">100000"}
    action: confirm
    reason: 大批量导出（> 10 万行）需确认脱敏与落盘范围

# --- 首页路由与推荐问题 ------------------------------------------------------
routing:
  keywords: [分析, 归因, 报告, 趋势, 对比, 占比, 下滑, 洞察, 可视化, 拆解, 贡献度, 异动, 复盘]
  specificity: 0.85               # 高于 db-query(0.8)：分析类问句更长、意图更明确
recommended_questions:
  - {text: 生成 Walmart 销售分析报告, hint: 圈数据集→多步取数→图表→结论→报告}
  - {text: 分析本月华东区销售下滑的归因，出图文报告, hint: 数据集圈定 + valid_gmv@v2 pin + 渠道/品类贡献度拆解 + HTML 报告}
  - {text: 对比华东华南近 12 周订单占比趋势, hint: 同一口径跨区对比，堆叠柱 + 占比折线 + 结论卡}
  - {text: 近 30 天各品类 GMV Top10 及环比，生成周报, hint: 时间粒度统一为日，Top10 榜单柱图 + 异动标注 + 周报}
  - {text: 618 大促 ROI 归因，哪些渠道品类拉动了增量, hint: 大促 vs 日常基线，增量拆解 + 投入产出散点 + 报告}

# --- 输出契约（完成标准）----------------------------------------------------
output_contract: report+charts    # 至少一份报告卡 + 支撑其结论的图表卡与引用 chips

# --- 快捷命令（/command，套件详情页展示，会话内可显式调用）------------------
commands:
  - name: /analyze
    description: 跑完整分析链路（圈数据集→多步取数→图表→结论→报告），默认产物为图文报告
    skill: multi-step-analysis
    example: "/analyze 本月华东区销售下滑归因，出图文报告"
  - name: /dataset
    description: 圈定/查看当前数据集（语义层表白名单 + 血缘 join 路径 + 口径与过滤）
    skill: dataset-scoping
    example: "/dataset 交易域，华东区，近 90 天"
  - name: /chart
    description: 对当前结果集出图（自动匹配柱/线/饼/散点，可显式指定类型与维度度量）
    skill: chart-advisor
    example: "/chart 按周 valid_gmv 折线，series=渠道"
  - name: /report
    description: 汇总本轮图表与结论，导出图文报告（HTML/PDF，含引用 chips）
    skill: report-generation
    example: "/report html 分享链接"
  - name: /attribute
    description: 归因分析（维度贡献度拆解 + 环比同比 + 异动定位），输出归因结论卡
    skill: attribution-analysis
    example: "/attribute 本月华东区 valid_gmv 下滑，拆渠道与品类"

# --- 包内技能索引（loader 走现有 skill registry，此处仅为 manifest 索引）----
skills:
  - name: dataset-scoping
    path: skills/dataset-scoping/SKILL.md
    command: /dataset
    summary: 数据集圈定（语义层表白名单 + 血缘 join 路径，禁止从全量表选表）
  - name: multi-step-analysis
    path: skills/multi-step-analysis/SKILL.md
    command: /analyze
    summary: 多步取数与跨步口径一致（指标版本 pin、默认过滤/时间粒度统一注入、步数收敛）
  - name: chart-advisor
    path: skills/chart-advisor/SKILL.md
    command: /chart
    summary: 图表自动匹配（柱/线/饼/散点选型、维度度量映射、ECharts option 容错与括号配平）
  - name: attribution-analysis
    path: skills/attribution-analysis/SKILL.md
    command: /attribute
    summary: 归因分析（维度贡献度拆解、环比同比、异动定位、假设-验证收敛）
  - name: report-generation
    path: skills/report-generation/SKILL.md
    command: /report
    summary: 图文报告生成（结论提炼、引用 chips、章节骨架、HTML/PDF 导出与分享）

# --- 样例库（Verified 分析样例，同时作为本套件的 eval set）------------------
few_shots:
  path: few_shots/verified-analyses.yaml
  consumption: metric_first       # 命中样例优先于泛化规划，作为多步计划 few-shot 注入
  writeback: on_thumbs_up         # 报告 👍 沉淀样例；✏️ 纠错进语义标注待审队列
  eval_set: true                  # 推荐问题 + verified 样例 = 本套件评测集（设计 §5.8）
