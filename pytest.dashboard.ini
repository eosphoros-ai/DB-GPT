[pytest]
addopts = --import-mode=importlib -p no:cacheprovider --basetemp=.pytest-dashboard-tmp
testpaths = packages/dbgpt-app/src/dbgpt_app/openapi/api_v1/dashboard/tests
markers =
    mysql_integration: requires DASHBOARD_TEST_MYSQL_URL and a disposable MySQL database
    redis_integration: requires DASHBOARD_TEST_REDIS_URL and a disposable Redis database
pythonpath =
    packages/dbgpt-app/src
    packages/dbgpt-client/src
    packages/dbgpt-core/src
    packages/dbgpt-ext/src
    packages/dbgpt-sandbox/src
    packages/dbgpt-serve/src
