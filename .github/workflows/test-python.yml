name: Test Python

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - packages/**
      - pilot/meta_data/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/test-python.yml
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - packages/**
      - pilot/meta_data/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/test-python.yml

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: .venv-python-ci
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        # TODO: Add windows-latest support
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked workspace and test dependencies
        # Install workspace members, root test tools and the optional proxy under test.
        run: uv sync --frozen --package dbgpt-app --package dbgpt --package dbgpt-mono --extra base --extra collaboration --extra proxy_litellm

      - name: Verify environment
        run: |
          uv run --no-sync python --version
          uv run --no-sync python -m pip check

      - name: Run tests
        run: |
          uv run --no-sync python -m pytest --pyargs dbgpt --cov=dbgpt --cov-report=xml:coverage-${{ matrix.python-version }}-${{ matrix.os }}.xml --cov-report=html:htmlcov-${{ matrix.python-version }}-${{ matrix.os }} --junitxml=pytest_report-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Summarize test and coverage reports
        if: always()
        env:
          REPORT_SUFFIX: ${{ matrix.python-version }}-${{ matrix.os }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          suffix = os.environ["REPORT_SUFFIX"]
          junit = Path(f"pytest_report-{suffix}.xml")
          coverage = Path(f"coverage-{suffix}.xml")
          lines = [f"## Python tests ({suffix})"]
          if junit.exists():
              suites = ElementTree.parse(junit).getroot().iter("testsuite")
              totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, 0))
              lines.append(", ".join(f"{key}: {value}" for key, value in totals.items()))
          else:
              lines.append("No JUnit report was produced; inspect earlier job steps.")
          if coverage.exists():
              rate = float(ElementTree.parse(coverage).getroot().get("line-rate", 0))
              lines.append(f"Line coverage: {rate:.2%}")
          summary = "\n\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)

      - name: Upload test and coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            pytest_report-${{ matrix.python-version }}-${{ matrix.os }}.xml
            coverage-${{ matrix.python-version }}-${{ matrix.os }}.xml
            htmlcov-${{ matrix.python-version }}-${{ matrix.os }}/*
          if-no-files-found: ignore
