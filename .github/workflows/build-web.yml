name: Build Web Application

# Triggered when the web directory or this file is changed
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/build-web.yml
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - web/**
      - .github/workflows/build-web.yml

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Runs all jobs in the web directory
    working-directory: ./web

jobs:
  build-web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # FIXME: Add windows-latest support
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm used by the lockfile
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: |
          npm ci

      - name: Check types and build contracts
        run: |
          npm run typecheck
          npm run lint
          npm run test:build
          npm test

      - name: Test Dashboard components
        run: |
          mkdir -p ../output/ci
          npm run test:dashboard -- --reporter=default --reporter=junit --outputFile.junit=../output/ci/dashboard-components.xml

      - name: Build web application
        run: |
          npm run build

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Test Dashboard production pages
        env:
          DASHBOARD_E2E_START_SERVER: '1'
          DASHBOARD_E2E_BASE_URL: http://127.0.0.1:5670
          DASHBOARD_E2E_DISABLE_VIDEO: '1'
          # These two suites need existing model-generated assets and a backend.
          # Discover them and report their seven explicit skips; do not filter them out.
          DASHBOARD_E2E_LIVE_AGENT: '0'
          DASHBOARD_E2E_ARTIFACTS: ../output/ci/browser-screenshots
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../output/ci/dashboard-browser.json
        run: npm run test:e2e:dashboard -- --workers=2 --retries=0 --reporter=list,json

      - name: Build static distribution
        run: npm run compile

      - name: Upload Dashboard test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-${{ matrix.os }}
          path: |
            output/ci/
            output/playwright/test-results/
          if-no-files-found: warn
          retention-days: 14
