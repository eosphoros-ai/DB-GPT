name: Build Web Application

permissions:
  contents: read

# Triggered when the web directory or this file is changed
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/build-web.yml
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - web/**
      - .github/workflows/build-web.yml

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Runs all jobs in the web directory
    working-directory: ./web

jobs:
  build-web:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # FIXME: Add windows-latest support
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm used by the lockfile
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: |
          npm ci

      - name: Check types and build contracts
        run: |
          npm run typecheck
          npm run lint
          npm run test:build
          npm test

      - name: Build web application
        run: |
          npm run build

      - name: Build static distribution
        run: npm run compile
